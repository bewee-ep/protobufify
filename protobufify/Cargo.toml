[package]
name = "protobufify"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bewee-ep/protobufify"
readme = "../README.md"
description = "Protocol Buffers for existing Rust types: derive the .proto schema, pin field numbers in a lock file, encode and decode messages"

[features]
default = ["std", "derive", "decode", "encode"]
std = ["prost?/std"]
derive = ["dep:protobufify-derive"]
decode = ["dep:prost"]
encode = ["dep:prost"]

[dependencies]
protobufify-derive = { path = "../protobufify-derive", version = "0.1.0", optional = true }
# Pinned to a minor version: the derived decoders and encoders use `prost::encoding`, which prost keeps
# `#[doc(hidden)]` for its own derive and does not cover by semver.
prost = { version = "~0.14.4", default-features = false, optional = true }

[dev-dependencies]
assert_matches = "1.5"
